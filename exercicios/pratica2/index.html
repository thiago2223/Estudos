<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Oficial</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="glass-header">
        <div class="logo-area">
            <h1>Loja Oficial</h1>
            <h2>Acessórios • Vestimentas • Items</h2>
        </div>
        <nav class="nav-menu">
            <div class="search-bar">
                <input type="text" id="input-pesquisa" placeholder="Pesquisar produtos...">
            </div>
            <a href="cadastrar-produto.html" class="btn-nav">Cadastrar Produto</a>
        </nav>
    </header>

    <main class="container">
        <section id="filtros" class="filter-section">
            <button class="btn-filter active">Mais novo</button>
            <button class="btn-filter">Mais antigo</button>
            <button class="btn-filter">Popular</button>
        </section>

        <section id="produtos" class="products-grid">
            <!-- Os produtos serão injetados aqui pelo JavaScript -->
        </section>
    </main>

    <footer class="glass-footer">
        <div id="dev" class="footer-info">
            <p>Desenvolvido por: <a href="#">DevThiagoCBM</a></p>
        </div>
        <div id="mais-sobre" class="footer-links">
            <a href="#">Sobre a Loja</a>
            <a href="#">Contato</a>
        </div>
    </footer>
</body>
</html>
